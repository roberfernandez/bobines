<!DOCTYPE html>
<html lang="ca">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Guia visual de bobines per a distribuïdores DA.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bobines DA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Bobines DA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    html:not(.access-approved) #flutter_host,.access-approved #access-status{display:none}
    #access-status{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:#f4f7fb;color:#0b2948;font:500 16px system-ui,sans-serif;z-index:900}
    #access-retry{margin:14px auto 0;padding:10px 16px;border:0;border-radius:9px;background:#0b2948;color:white;font:600 15px system-ui,sans-serif}
  </style>
</head>
<body>
  <a class="tmb-home tmb-return-button" href="https://roberfernandez.github.io/tmb-agent/" aria-label="Tornar a TMB Agent" title="Tornar a TMB Agent"><svg class="tmb-return-arrow" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M5 12h14"/></svg><img src="https://roberfernandez.github.io/tmb-agent/assets/icons/tmb-agent-192.png" alt=""></a>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    #flutter_host{position:absolute;inset:0;overflow:hidden}
    .tmb-home{position:fixed;z-index:1100;top:max(10px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#f4f7fbd9}
    .tmb-home img{width:32px;height:32px;border-radius:8px;object-fit:cover}
  </style>
  <section id="access-status"><div><p id="access-message">Comprovant el teu accés…</p><button id="access-retry" hidden>Tornar-ho a provar</button></div></section>
  <style>
/* Retorn compacte: icona TMB Agent dins un cercle groc. */
.tmb-return-button{display:inline-flex;align-items:center;justify-content:center;gap:0;width:52px;min-width:52px;height:52px;min-height:52px;padding:5px;box-sizing:border-box;border:2px solid #f1cb49;border-radius:999px;background:#182536;color:#f1cb49;flex:0 0 auto;text-decoration:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tmb-return-button img{display:block;width:38px;height:38px;border-radius:10px;object-fit:contain;flex:0 0 auto}
.tmb-return-button svg{display:none;width:22px;height:22px;flex:0 0 auto}
.tmb-return-button:hover{background:#26394d;border-color:#ffe177;color:#ffe177}
.tmb-return-button:active{background:#30465e}
.tmb-return-button:focus-visible{outline:3px solid #98c5e0;outline-offset:3px}

    :root{--tmb-return-height:calc(68px + env(safe-area-inset-top,0px))}
    body::before{content:"";position:fixed;inset:0 0 auto;height:var(--tmb-return-height);z-index:1000;background:#0c1624;border-bottom:1px solid #2d3b4a;box-sizing:border-box;pointer-events:none}
    #flutter_host{top:var(--tmb-return-height)}
    .tmb-home.tmb-return-button{top:calc(8px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px))}
</style>
  <div id="flutter_host"></div>
  <script type="module" src="bobines-access.js"></script>
</body>
</html>
