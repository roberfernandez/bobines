name: bobines
description: "Guía visual de bobinas para distribuidoras DA."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/icono_bobines.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icono_bobines.png"
  min_sdk_android: 21
